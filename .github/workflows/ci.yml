name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`. Next pulls sharp, whose wasm32 fallback
      # (@img/sharp-wasm32 → @napi-rs/wasm-runtime) declares optional @emnapi
      # deps. npm prunes that subtree on a Windows host, so a lockfile written
      # from this machine can never contain the entries `npm ci` then demands
      # on Linux — it fails on a lockfile npm itself refuses to complete.
      # `install` still honours every pin the lock does carry.
      # To restore `npm ci`: regenerate the lock once on Linux or WSL
      # (`rm package-lock.json && npm install`), commit it, and swap this back.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (fails on warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright smoke suite
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Hard budgets (§2.3): LCP < 2.5s, CLS < 0.05, script transfer < 200KB.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli autorun
